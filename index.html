<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProgramBots | Coding, Electronics and Robotics Classes for Ages 8 to 16</title>
<meta name="description" content="Most children forget what they built in robotics class within weeks. ProgramBots is being rebuilt so that what your child learns stays learned. New classes opening soon.">
<meta name="theme-color" content="#070B0F">

<meta property="og:title" content="ProgramBots">
<meta property="og:description" content="Your child built a robot. Can they build it again next month? Our new classes make sure the answer is yes.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.programbots.com/">
<meta property="og:image" content="https://www.programbots.com/logo.png">

<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --red:#ED1B24;
  --red-lit:#FF4A52;
  --teal:#11B0C8;
  --teal-lit:#3FD8EF;
  --copper:#E8A33D;
  --ink:#070B0F;
  --paper:#EEF4F7;
  --muted:#9DB0BC;
  --dim:#647886;
  --line:rgba(141,162,176,.16);
  --grid-min:rgba(17,176,200,.055);
  --grid-maj:rgba(17,176,200,.11);
  --max:1080px;
  --col:720px;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}

body{
  margin:0;
  background-color:var(--ink);
  color:var(--muted);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---- Background: two-level graph paper ---- */
.substrate{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:
    linear-gradient(var(--grid-min) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-min) 1px, transparent 1px),
    linear-gradient(var(--grid-maj) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-maj) 1px, transparent 1px);
  background-size:28px 28px, 28px 28px, 140px 140px, 140px 140px;
  background-position:center center;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 28%, #000 0%, rgba(0,0,0,.45) 55%, transparent 88%);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 28%, #000 0%, rgba(0,0,0,.45) 55%, transparent 88%);
}

/* ---- Background: circuit board traces ---- */
.traces{
  position:fixed;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:.75;
}
.trace{
  fill:none;
  stroke:rgba(17,176,200,.28);
  stroke-width:1.4;
  stroke-linecap:square;
  stroke-linejoin:miter;
}
.trace.thin{stroke:rgba(17,176,200,.16);stroke-width:1;}
.trace.warm{stroke:rgba(232,163,61,.20);}
.pad{fill:none;stroke:rgba(17,176,200,.34);stroke-width:1.4;}
.pad-core{fill:var(--ink);}

.signal{
  fill:none;
  stroke:var(--teal-lit);
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-dasharray:30 1600;
  filter:drop-shadow(0 0 5px rgba(63,216,239,.85));
  animation:flow 9s linear infinite;
}
.signal.s2{stroke:var(--red-lit);filter:drop-shadow(0 0 5px rgba(255,74,82,.8));animation-duration:13s;animation-delay:2.4s;}
.signal.s3{stroke:var(--copper);filter:drop-shadow(0 0 5px rgba(232,163,61,.8));animation-duration:11s;animation-delay:5.1s;}
@keyframes flow{from{stroke-dashoffset:1630;}to{stroke-dashoffset:0;}}

/* ---- Corner crosshair marks ---- */
.reg{position:fixed;z-index:1;width:22px;height:22px;pointer-events:none;opacity:.5;}
.reg::before,.reg::after{content:"";position:absolute;background:rgba(17,176,200,.5);}
.reg::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%);}
.reg::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%);}
.reg.tl{top:22px;left:22px;}
.reg.tr{top:22px;right:22px;}
.reg.bl{bottom:22px;left:22px;}
.reg.br{bottom:22px;right:22px;}

/* ---- Brand rule ---- */
.brandbar{
  position:relative;z-index:3;
  height:3px;
  background:linear-gradient(90deg,var(--red) 0%,var(--red) 34%,var(--copper) 34%,var(--copper) 52%,var(--teal) 52%,var(--teal) 100%);
}

/* ---- Shell ---- */
.shell{position:relative;z-index:2;}
.col{max-width:var(--col);margin:0 auto;}
.wide{max-width:var(--max);margin:0 auto;}

/* ---- Small labels ---- */
.tag{
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;
  font-weight:500;
  letter-spacing:.17em;
  text-transform:uppercase;
  color:var(--teal);
}
.rule{
  display:flex;align-items:center;gap:14px;
  margin:0 0 26px;
}
.rule::after{content:"";flex:1;height:1px;background:var(--line);}

/* ---- Hero ---- */
.hero{
  padding:74px 24px 88px;
  text-align:center;
}
.logo{
  width:100%;
  max-width:300px;
  height:auto;
  display:block;
  margin:0 auto 32px;
}
.status{
  display:inline-flex;align-items:center;gap:9px;
  padding:6px 15px 6px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(17,176,200,.05);
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;
  color:var(--paper);
  margin-bottom:30px;
}
.dot{
  width:7px;height:7px;border-radius:50%;background:var(--red);
  box-shadow:0 0 0 0 rgba(237,27,36,.55);
  animation:pulse 2.6s ease-out infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(237,27,36,.55);}
  70%{box-shadow:0 0 0 10px rgba(237,27,36,0);}
  100%{box-shadow:0 0 0 0 rgba(237,27,36,0);}
}

h1{
  margin:0 auto 22px;
  max-width:19ch;
  font-size:clamp(34px,6vw,62px);
  line-height:1.08;
  letter-spacing:-.035em;
  font-weight:800;
  color:var(--paper);
}
h1 .lit{color:var(--teal-lit);}

.lede{
  margin:0 auto;
  max-width:58ch;
  font-size:clamp(16.5px,2.1vw,19px);
  line-height:1.62;
}
.lede strong{color:var(--paper);font-weight:700;}

/* ---- Sections ---- */
section{padding:66px 24px;border-top:1px solid var(--line);}
h2{
  margin:0 0 16px;
  font-size:clamp(23px,3.4vw,32px);
  line-height:1.2;
  letter-spacing:-.025em;
  font-weight:800;
  color:var(--paper);
}
p{margin:0 0 16px;}
p:last-child{margin-bottom:0;}
.big{font-size:18px;line-height:1.6;color:var(--paper);}

/* ---- Student and parent cards ---- */
.who{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:30px;
}
.who-card{
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(238,244,247,.022);
  padding:22px 20px;
}
.who-card h3{
  margin:0 0 8px;
  font-size:16px;font-weight:700;
  color:var(--paper);
}
.who-card:nth-child(1) h3{color:var(--teal-lit);}
.who-card:nth-child(2) h3{color:var(--copper);}
.who-card p{font-size:15px;line-height:1.55;margin:0;}

/* ---- Number tiles ---- */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin:34px 0 28px;
}
.stat{
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(238,244,247,.022);
  padding:22px 20px;
}
.stat .fig{
  display:block;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:clamp(26px,4vw,34px);
  font-weight:700;
  letter-spacing:-.03em;
  line-height:1.05;
  color:var(--teal-lit);
  margin-bottom:10px;
}
.stat:nth-child(2) .fig{color:var(--copper);}
.stat:nth-child(3) .fig{color:var(--red-lit);}
.stat .what{display:block;font-size:14.5px;line-height:1.55;color:var(--muted);margin-bottom:10px;}
.stat .src{
  display:block;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.05em;color:var(--dim);
}

/* ---- How a class works ---- */
.method{border-top:1px solid var(--line);margin-top:30px;}
.row{
  display:grid;
  grid-template-columns:44px 1fr 1.6fr;
  gap:22px;
  padding:22px 0;
  border-bottom:1px solid var(--line);
  align-items:start;
}
.row .num{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:13px;font-weight:700;letter-spacing:.06em;
  color:var(--teal);
  padding-top:2px;
}
.row h3{
  margin:0;
  font-size:17px;font-weight:700;letter-spacing:-.012em;
  color:var(--paper);
}
.row .impl{font-size:15.5px;line-height:1.55;margin:0;}

/* ---- Levels ---- */
.levels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:30px;
}
.level{
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(238,244,247,.022);
